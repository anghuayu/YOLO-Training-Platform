<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="annotationTool">标注工具</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="sidebar-container"></div>

    <div class="main-content" style="display: flex; flex-direction: column; height: 100vh;">
        <!-- Header -->
        <div class="page-header" style="flex-shrink: 0;">
            <div style="display: flex; align-items: center; gap: 16px;">
                <a href="/datasets" class="btn btn-sm btn-outline" title="Back">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <div>
                    <h1 data-i18n="annotationTool">标注工具</h1>
                    <div class="subtitle" data-i18n="drawBoxes">绘制目标框标注物体</div>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="image-counter" style="font-size: 13px; color: var(--text-secondary);"></span>
                <button class="btn btn-sm btn-primary" id="save-btn" onclick="saveAnnotations()">
                    <i class="fas fa-save"></i>
                    <span data-i18n="save">保存</span>
                </button>
            </div>
        </div>

        <!-- Annotation Layout -->
        <div class="annotation-layout" style="flex: 1; overflow: hidden;">
            <!-- Left Sidebar: Image List -->
            <div class="annotation-sidebar" style="flex-shrink: 0;">
                <div style="padding: 12px; border-bottom: 1px solid var(--border);">
                    <div style="position: relative;">
                        <i class="fas fa-search" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 12px;"></i>
                        <input type="text" id="image-search" class="form-control" style="padding-left: 32px; font-size: 13px;"
                               data-i18n-ph="searchImagesShort" placeholder="搜索..."
                               oninput="filterImages()">
                    </div>
                </div>
                <div class="image-list" id="image-list">
                    <div class="empty-state" style="padding: 20px;">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p data-i18n="loading">加载中...</p>
                    </div>
                </div>
            </div>

            <!-- Center: Canvas Area -->
            <div class="annotation-main">
                <!-- Toolbar -->
                <div class="annotation-toolbar">
                    <div style="display: flex; gap: 4px;">
                        <button class="tool-btn active" id="tool-draw" onclick="setTool('draw')" data-i18n-title="drawBox" title="Draw Box">
                            <i class="fas fa-vector-square"></i>
                        </button>
                        <button class="tool-btn" id="tool-select" onclick="setTool('select')" data-i18n-title="select" title="Select">
                            <i class="fas fa-mouse-pointer"></i>
                        </button>
                        <button class="tool-btn" id="tool-pan" onclick="setTool('pan')" data-i18n-title="pan" title="Pan">
                            <i class="fas fa-hand-paper"></i>
                        </button>
                    </div>

                    <div style="width: 1px; height: 24px; background: var(--border); margin: 0 4px;"></div>

                    <div style="display: flex; gap: 4px;">
                        <button class="tool-btn" onclick="zoomIn()" data-i18n-title="zoomIn" title="Zoom In">
                            <i class="fas fa-search-plus"></i>
                        </button>
                        <button class="tool-btn" onclick="zoomOut()" data-i18n-title="zoomOut" title="Zoom Out">
                            <i class="fas fa-search-minus"></i>
                        </button>
                        <button class="tool-btn" onclick="fitView()" data-i18n-title="fitView" title="Fit View">
                            <i class="fas fa-expand"></i>
                        </button>
                    </div>

                    <div style="width: 1px; height: 24px; background: var(--border); margin: 0 4px;"></div>

                    <div style="display: flex; gap: 4px;">
                        <button class="tool-btn" onclick="prevImage()" data-i18n-title="prevImg" title="Previous">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="tool-btn" onclick="nextImage()" data-i18n-title="nextImg" title="Next">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>

                    <div style="width: 1px; height: 24px; background: var(--border); margin: 0 4px;"></div>

                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary); white-space: nowrap;" data-i18n="classLabel">类别:</label>
                        <select id="class-selector" class="form-control" style="width: auto; min-width: 120px; padding: 6px 30px 6px 10px; font-size: 13px;">
                        </select>
                    </div>

                    <div style="flex: 1;"></div>

                    <div id="zoom-display" style="font-size: 12px; color: var(--text-secondary); font-weight: 600;">100%</div>
                </div>

                <!-- Canvas -->
                <div class="annotation-canvas-wrapper" id="canvas-wrapper">
                    <canvas id="annotation-canvas"></canvas>
                    <div id="canvas-placeholder" style="color: #64748b; text-align: center; position: absolute;">
                        <i class="fas fa-image" style="font-size: 48px; opacity: 0.3; margin-bottom: 12px;"></i>
                        <p data-i18n="loading">加载中...</p>
                    </div>
                </div>
            </div>

            <!-- Right Sidebar: Labels & Smart Annotation -->
            <div class="annotation-properties" style="flex-shrink: 0;">
                <h4 data-i18n="labels">标注列表</h4>
                <div id="labels-list" style="margin-bottom: 16px;">
                    <div style="font-size: 13px; color: var(--text-secondary); padding: 8px 0;" data-i18n="noAnnotations">当前图片无标注</div>
                </div>

                <div style="border-top: 1px solid var(--border); padding-top: 14px; margin-top: 14px;">
                    <h4 data-i18n="datasetClasses">数据集类别</h4>
                    <div id="dataset-classes-list"></div>
                    <div style="display: flex; gap: 6px; margin-top: 10px;">
                        <input type="text" id="new-class-input" class="form-control" placeholder="新增类别名称..."
                               style="flex: 1; font-size: 12px; padding: 6px 10px;"
                               onkeydown="if(event.key==='Enter')addClassFromAnnotate()">
                        <button class="btn btn-sm btn-primary" onclick="addClassFromAnnotate()" title="添加类别" style="padding: 6px 10px;">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>

                <!-- Smart Annotation Panel -->
                <div class="smart-annotate-panel">
                    <h4 style="display: flex; align-items: center; gap: 6px;">
                        <i class="fas fa-magic"></i>
                        <span data-i18n="smartAnnotateTitle">智能标注</span>
                    </h4>
                    <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 12px;" data-i18n="smartDesc">
                        基于已标注图片训练临时模型，自动预测未标注图片
                    </p>
                    <div style="margin-bottom: 10px;">
                        <label style="font-size: 12px; font-weight: 600; display: block; margin-bottom: 4px;" data-i18n="epochs">训练轮数</label>
                        <input type="number" id="sa-epochs" class="form-control" value="50" min="10" max="300" style="font-size: 13px; padding: 6px 10px;">
                    </div>
                    <div style="margin-bottom: 12px;">
                        <label style="font-size: 12px; font-weight: 600; display: block; margin-bottom: 4px;" data-i18n="confidence">置信度阈值</label>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <input type="range" id="sa-confidence" min="0.1" max="0.9" step="0.05" value="0.25"
                                   oninput="document.getElementById('sa-conf-val').textContent = this.value">
                            <span id="sa-conf-val" style="font-size: 13px; font-weight: 600; min-width: 32px; text-align: right;">0.25</span>
                        </div>
                    </div>
                    <button class="btn btn-sm btn-warning" style="width: 100%;" id="smart-annotate-btn" onclick="startSmartAnnotation()">
                        <i class="fas fa-magic"></i>
                        <span data-i18n="startSmart">开始智能标注</span>
                    </button>
                    <div id="smart-progress" style="display: none; margin-top: 10px;">
                        <div class="progress-bar" style="height: 6px;">
                            <div class="progress-fill" id="smart-progress-bar" style="width: 0%;"></div>
                        </div>
                        <div id="smart-status" style="font-size: 11px; color: var(--text-secondary); margin-top: 4px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
    // ============================================
    // State
    // ============================================
    const datasetId = window.location.pathname.split('/').pop();

    let images = [];
    let filteredImages = [];
    let currentImageIndex = -1;
    let currentImage = null;      // HTMLImageElement
    let annotations = [];         // [{classId, x_center, y_center, width, height}] in YOLO format (normalized 0-1)
    let datasetInfo = null;
    let classes = [];

    // Canvas state
    let canvas, ctx;
    let canvasWidth = 0, canvasHeight = 0;
    let scale = 1;
    let offsetX = 0, offsetY = 0;
    let imgDisplayWidth = 0, imgDisplayHeight = 0;

    // Tool state
    let currentTool = 'draw';     // 'draw' | 'select' | 'pan'
    let isDrawing = false;
    let isDragging = false;
    let isPanning = false;
    let drawStart = null;         // {x, y} in canvas coords
    let drawCurrent = null;
    let selectedBoxIndex = -1;
    let dragOffset = null;

    // Pan state
    let panStart = null;
    let panOffsetStart = null;

    // Smart annotation
    let smartTaskId = null;
    let smartPollInterval = null;

    // Colors for classes
    const CLASS_COLORS = [
        '#3b82f6', '#ef4444', '#22c55e', '#f59e0b', '#8b5cf6',
        '#06b6d4', '#ec4899', '#14b8a6', '#f97316', '#6366f1',
        '#84cc16', '#e11d48', '#0ea5e9', '#a855f7', '#d946ef',
        '#10b981', '#f43f5e', '#64748b', '#eab308', '#2dd4bf'
    ];

    function getClassColor(classId) {
        return CLASS_COLORS[classId % CLASS_COLORS.length];
    }

    // ============================================
    // Initialization
    // ============================================
    document.getElementById('sidebar-container').innerHTML = getSidebarHTML('datasets');

    document.addEventListener('DOMContentLoaded', async () => {
        canvas = document.getElementById('annotation-canvas');
        ctx = canvas.getContext('2d');

        setupCanvasEvents();
        setupKeyboardShortcuts();

        try {
            datasetInfo = await API.get('/api/datasets/' + datasetId);
            classes = datasetInfo.classes || [];
            renderClassSelector();
            renderDatasetClasses();
            await loadImages();
        } catch (error) {
            console.error('Failed to load dataset:', error);
            showToast(t('error') + ': ' + error.message, 'error');
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            render();
        });
    });

    // ============================================
    // Canvas Setup
    // ============================================
    function resizeCanvas() {
        const wrapper = document.getElementById('canvas-wrapper');
        if (!wrapper) return;
        canvasWidth = wrapper.clientWidth;
        canvasHeight = wrapper.clientHeight;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
    }

    function setupCanvasEvents() {
        canvas.addEventListener('mousedown', onCanvasMouseDown);
        canvas.addEventListener('mousemove', onCanvasMouseMove);
        canvas.addEventListener('mouseup', onCanvasMouseUp);
        canvas.addEventListener('wheel', onCanvasWheel, { passive: false });
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    }

    // ============================================
    // Coordinate Conversions
    // ============================================
    // Image pixel -> canvas screen coords
    function imgToScreen(x, y) {
        return {
            x: x * scale + offsetX,
            y: y * scale + offsetY
        };
    }

    // Canvas screen coords -> image pixel coords
    function screenToImg(sx, sy) {
        return {
            x: (sx - offsetX) / scale,
            y: (sy - offsetY) / scale
        };
    }

    // Image pixel coords -> normalized YOLO (0-1)
    function imgToYolo(px, py) {
        if (!currentImage) return { x: 0, y: 0 };
        return {
            x: px / currentImage.naturalWidth,
            y: py / currentImage.naturalHeight
        };
    }

    // Normalized YOLO -> image pixel coords
    function yoloToImg(nx, ny) {
        if (!currentImage) return { x: 0, y: 0 };
        return {
            x: nx * currentImage.naturalWidth,
            y: ny * currentImage.naturalHeight
        };
    }

    // Get mouse position relative to canvas
    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    // ============================================
    // Rendering
    // ============================================
    function render() {
        if (!ctx || !canvas.width) return;
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        if (!currentImage) return;

        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        // Draw image
        ctx.drawImage(currentImage, 0, 0, imgDisplayWidth, imgDisplayHeight);

        // Draw existing annotations
        annotations.forEach((ann, idx) => {
            const topLeft = yoloToImg(ann.x_center - ann.width / 2, ann.y_center - ann.height / 2);
            const size = yoloToImg(ann.width, ann.height);
            const w = Math.abs(size.x);
            const h = Math.abs(size.y);
            const color = getClassColor(ann.classId);

            // Fill
            ctx.fillStyle = color + '20';
            ctx.fillRect(topLeft.x, topLeft.y, w, h);

            // Stroke
            ctx.strokeStyle = color;
            ctx.lineWidth = 2 / scale;
            ctx.strokeRect(topLeft.x, topLeft.y, w, h);

            // Selection highlight
            if (idx === selectedBoxIndex) {
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1 / scale;
                ctx.setLineDash([4 / scale, 4 / scale]);
                ctx.strokeRect(topLeft.x - 2 / scale, topLeft.y - 2 / scale, w + 4 / scale, h + 4 / scale);
                ctx.setLineDash([]);
            }

            // Label
            const label = classes[ann.classId] || ('class_' + ann.classId);
            const fontSize = Math.max(12, 14 / scale);
            ctx.font = `600 ${fontSize}px -apple-system, sans-serif`;
            const textWidth = ctx.measureText(label).width;
            const labelH = fontSize + 6;
            const labelY = topLeft.y - labelH;

            ctx.fillStyle = color;
            ctx.fillRect(topLeft.x, labelY, textWidth + 8, labelH);

            ctx.fillStyle = '#ffffff';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, topLeft.x + 4, labelY + labelH / 2);
        });

        // Draw current drawing rectangle
        if (isDrawing && drawStart && drawCurrent) {
            const x = Math.min(drawStart.x, drawCurrent.x);
            const y = Math.min(drawStart.y, drawCurrent.y);
            const w = Math.abs(drawCurrent.x - drawStart.x);
            const h = Math.abs(drawCurrent.y - drawStart.y);

            const classId = parseInt(document.getElementById('class-selector').value) || 0;
            const color = getClassColor(classId);

            ctx.fillStyle = color + '30';
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2 / scale;
            ctx.setLineDash([6 / scale, 3 / scale]);
            ctx.strokeRect(x, y, w, h);
            ctx.setLineDash([]);
        }

        ctx.restore();
    }

    // ============================================
    // Image Loading
    // ============================================
    async function loadImages() {
        try {
            images = await API.get('/api/datasets/' + datasetId + '/images');
            filteredImages = [...images];
            renderImageList();
            if (images.length > 0) {
                await selectImage(0);
            } else {
                document.getElementById('canvas-placeholder').style.display = '';
            }
        } catch (error) {
            console.error('Failed to load images:', error);
            showToast(t('error') + ': ' + error.message, 'error');
        }
    }

    function renderImageList() {
        const container = document.getElementById('image-list');
        const searchTerm = (document.getElementById('image-search').value || '').toLowerCase();

        if (filteredImages.length === 0) {
            container.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-secondary); font-size: 13px;">
                <i class="fas fa-search" style="font-size: 24px; opacity: 0.3; margin-bottom: 8px; display: block;"></i>
                ${searchTerm ? t('noAnnotations') : t('noDatasets')}
            </div>`;
            return;
        }

        const html = filteredImages.map((img, idx) => {
            const globalIdx = images.indexOf(img);
            const isActive = globalIdx === currentImageIndex;
            const hasAnnotation = img.annotated || img.has_annotation || img.has_annotations;
            const statusClass = hasAnnotation ? 'done' : 'pending';
            const thumbUrl = img.path || img.url || img.thumbnail || '';

            return `<div class="image-item ${isActive ? 'active' : ''}" onclick="selectImage(${globalIdx})" data-index="${globalIdx}">
                <img src="${thumbUrl}" alt="${img.filename || img.name || ''}" onerror="this.style.display='none'">
                <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${img.filename || img.name || ''}</span>
                <span class="status-dot ${statusClass}"></span>
            </div>`;
        }).join('');

        container.innerHTML = html;
    }

    function filterImages() {
        const term = (document.getElementById('image-search').value || '').toLowerCase();
        if (!term) {
            filteredImages = [...images];
        } else {
            filteredImages = images.filter(img => {
                const name = (img.filename || img.name || '').toLowerCase();
                return name.includes(term);
            });
        }
        renderImageList();
    }

    async function selectImage(index) {
        if (index < 0 || index >= images.length) return;

        // Auto-save previous annotations
        if (currentImageIndex >= 0 && currentImageIndex < images.length) {
            await saveAnnotationsQuiet();
        }

        currentImageIndex = index;
        selectedBoxIndex = -1;

        const imgData = images[index];
        const img = new Image();
        img.crossOrigin = 'anonymous';

        img.onload = async () => {
            currentImage = img;
            imgDisplayWidth = img.naturalWidth;
            imgDisplayHeight = img.naturalHeight;

            document.getElementById('canvas-placeholder').style.display = 'none';

            resizeCanvas();
            fitView();

            // Load annotations
            await loadAnnotations(imgData.filename || imgData.name);

            renderImageList();
            updateImageCounter();
            render();
        };

        img.onerror = () => {
            showToast(t('error') + ': Failed to load image', 'error');
        };

        img.src = imgData.path || imgData.url || imgData.src;
    }

    async function loadAnnotations(imageName) {
        if (!imageName) { annotations = []; renderLabelsList(); return; }
        try {
            const data = await API.get('/api/annotations/' + datasetId + '/' + encodeURIComponent(imageName));
            // Backend returns {image, boxes: [{class_id, ...}]}, convert to frontend format {classId, ...}
            const rawBoxes = data.boxes || data.annotations || [];
            annotations = rawBoxes.map(b => ({
                classId: b.class_id !== undefined ? b.class_id : b.classId,
                x_center: b.x_center,
                y_center: b.y_center,
                width: b.width,
                height: b.height
            }));
        } catch (e) {
            // 404 or no annotations yet
            annotations = [];
        }
        renderLabelsList();
    }

    function updateImageCounter() {
        const el = document.getElementById('image-counter');
        if (el && images.length > 0) {
            el.textContent = (currentImageIndex + 1) + ' / ' + images.length;
        }
    }

    // ============================================
    // Save Annotations
    // ============================================
    async function saveAnnotations() {
        await saveAnnotationsQuiet();
        showToast(t('saved'), 'success');
    }

    async function saveAnnotationsQuiet() {
        if (currentImageIndex < 0 || currentImageIndex >= images.length) return;
        const imgData = images[currentImageIndex];
        const imageName = imgData.filename || imgData.name;
        if (!imageName) return;

        try {
            // Convert frontend format (classId) to backend format (class_id)
            const boxes = annotations.map(a => ({
                class_id: a.classId !== undefined ? a.classId : a.class_id,
                x_center: a.x_center,
                y_center: a.y_center,
                width: a.width,
                height: a.height
            }));
            await API.put('/api/annotations/' + datasetId + '/' + encodeURIComponent(imageName), {
                image_name: imageName,
                boxes: boxes
            });
            // Mark as annotated in the list
            imgData.annotated = true;
            imgData.has_annotations = true;
        } catch (e) {
            console.error('Failed to save annotations:', e);
        }
    }

    // ============================================
    // Tools
    // ============================================
    function setTool(tool) {
        currentTool = tool;
        document.querySelectorAll('.annotation-toolbar .tool-btn').forEach(btn => btn.classList.remove('active'));
        const btn = document.getElementById('tool-' + tool);
        if (btn) btn.classList.add('active');

        // Update cursor
        if (tool === 'draw') canvas.style.cursor = 'crosshair';
        else if (tool === 'select') canvas.style.cursor = 'default';
        else if (tool === 'pan') canvas.style.cursor = 'grab';

        selectedBoxIndex = -1;
        render();
    }

    // ============================================
    // Mouse Handlers
    // ============================================
    function onCanvasMouseDown(e) {
        if (!currentImage) return;
        const pos = getCanvasPos(e);
        const imgPos = screenToImg(pos.x, pos.y);

        // Middle mouse = pan regardless of tool
        if (e.button === 1) {
            e.preventDefault();
            startPan(pos);
            return;
        }

        if (e.button !== 0) return;

        if (currentTool === 'pan') {
            startPan(pos);
        } else if (currentTool === 'draw') {
            // Check if click is within image bounds
            if (imgPos.x >= 0 && imgPos.x <= imgDisplayWidth && imgPos.y >= 0 && imgPos.y <= imgDisplayHeight) {
                isDrawing = true;
                drawStart = { x: imgPos.x, y: imgPos.y };
                drawCurrent = { x: imgPos.x, y: imgPos.y };
            }
        } else if (currentTool === 'select') {
            const hitIdx = hitTestBox(imgPos.x, imgPos.y);
            if (hitIdx >= 0) {
                selectedBoxIndex = hitIdx;
                isDragging = true;
                const ann = annotations[hitIdx];
                const boxTopLeft = yoloToImg(ann.x_center - ann.width / 2, ann.y_center - ann.height / 2);
                dragOffset = { x: imgPos.x - boxTopLeft.x, y: imgPos.y - boxTopLeft.y };
            } else {
                selectedBoxIndex = -1;
            }
            renderLabelsList();
            render();
        }
    }

    function onCanvasMouseMove(e) {
        if (!currentImage) return;
        const pos = getCanvasPos(e);
        const imgPos = screenToImg(pos.x, pos.y);

        if (isPanning && panStart) {
            offsetX = panOffsetStart.x + (pos.x - panStart.x);
            offsetY = panOffsetStart.y + (pos.y - panStart.y);
            render();
            return;
        }

        if (isDrawing) {
            // Clamp to image bounds
            drawCurrent = {
                x: Math.max(0, Math.min(imgDisplayWidth, imgPos.x)),
                y: Math.max(0, Math.min(imgDisplayHeight, imgPos.y))
            };
            render();
            return;
        }

        if (isDragging && selectedBoxIndex >= 0) {
            const ann = annotations[selectedBoxIndex];
            const newX = imgPos.x - dragOffset.x;
            const newY = imgPos.y - dragOffset.y;
            const yoloTopLeft = imgToYolo(newX, newY);
            const yoloSize = imgToYolo(ann.width * currentImage.naturalWidth, ann.height * currentImage.naturalHeight);
            ann.x_center = yoloTopLeft.x + yoloSize.x / 2;
            ann.y_center = yoloTopLeft.y + yoloSize.y / 2;
            // Clamp
            ann.x_center = Math.max(ann.width / 2, Math.min(1 - ann.width / 2, ann.x_center));
            ann.y_center = Math.max(ann.height / 2, Math.min(1 - ann.height / 2, ann.y_center));
            render();
            renderLabelsList();
            return;
        }

        // Update cursor for select mode
        if (currentTool === 'select') {
            const hitIdx = hitTestBox(imgPos.x, imgPos.y);
            canvas.style.cursor = hitIdx >= 0 ? 'move' : 'default';
        }
    }

    function onCanvasMouseUp(e) {
        if (isPanning) {
            isPanning = false;
            panStart = null;
            if (currentTool === 'pan') canvas.style.cursor = 'grab';
            return;
        }

        if (isDrawing && drawStart && drawCurrent) {
            isDrawing = false;

            const x1 = Math.min(drawStart.x, drawCurrent.x);
            const y1 = Math.min(drawStart.y, drawCurrent.y);
            const x2 = Math.max(drawStart.x, drawCurrent.x);
            const y2 = Math.max(drawStart.y, drawCurrent.y);

            const minSize = 5; // minimum pixel size to register a box
            if ((x2 - x1) > minSize && (y2 - y1) > minSize) {
                const topLeft = imgToYolo(x1, y1);
                const bottomRight = imgToYolo(x2, y2);

                const classId = parseInt(document.getElementById('class-selector').value) || 0;
                annotations.push({
                    classId: classId,
                    x_center: (topLeft.x + bottomRight.x) / 2,
                    y_center: (topLeft.y + bottomRight.y) / 2,
                    width: bottomRight.x - topLeft.x,
                    height: bottomRight.y - topLeft.y
                });

                selectedBoxIndex = annotations.length - 1;
                renderLabelsList();
            }

            drawStart = null;
            drawCurrent = null;
            render();
            return;
        }

        if (isDragging) {
            isDragging = false;
            dragOffset = null;
        }
    }

    function onCanvasWheel(e) {
        e.preventDefault();
        if (!currentImage) return;

        const pos = getCanvasPos(e);
        const zoomFactor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        const newScale = Math.max(0.1, Math.min(20, scale * zoomFactor));

        // Zoom toward mouse position
        const imgPos = screenToImg(pos.x, pos.y);
        scale = newScale;
        offsetX = pos.x - imgPos.x * scale;
        offsetY = pos.y - imgPos.y * scale;

        updateZoomDisplay();
        render();
    }

    function startPan(pos) {
        isPanning = true;
        panStart = { x: pos.x, y: pos.y };
        panOffsetStart = { x: offsetX, y: offsetY };
        canvas.style.cursor = 'grabbing';
    }

    // ============================================
    // Hit Testing
    // ============================================
    function hitTestBox(imgX, imgY) {
        // Iterate in reverse so top-drawn boxes are hit first
        for (let i = annotations.length - 1; i >= 0; i--) {
            const ann = annotations[i];
            const left = (ann.x_center - ann.width / 2) * imgDisplayWidth;
            const top = (ann.y_center - ann.height / 2) * imgDisplayHeight;
            const right = (ann.x_center + ann.width / 2) * imgDisplayWidth;
            const bottom = (ann.y_center + ann.height / 2) * imgDisplayHeight;

            if (imgX >= left && imgX <= right && imgY >= top && imgY <= bottom) {
                return i;
            }
        }
        return -1;
    }

    // ============================================
    // Zoom Controls
    // ============================================
    function zoomIn() {
        if (!currentImage) return;
        const center = { x: canvasWidth / 2, y: canvasHeight / 2 };
        const imgPos = screenToImg(center.x, center.y);
        scale = Math.min(20, scale * 1.3);
        offsetX = center.x - imgPos.x * scale;
        offsetY = center.y - imgPos.y * scale;
        updateZoomDisplay();
        render();
    }

    function zoomOut() {
        if (!currentImage) return;
        const center = { x: canvasWidth / 2, y: canvasHeight / 2 };
        const imgPos = screenToImg(center.x, center.y);
        scale = Math.max(0.1, scale / 1.3);
        offsetX = center.x - imgPos.x * scale;
        offsetY = center.y - imgPos.y * scale;
        updateZoomDisplay();
        render();
    }

    function fitView() {
        if (!currentImage) return;
        resizeCanvas();
        const padding = 20;
        const scaleX = (canvasWidth - padding * 2) / imgDisplayWidth;
        const scaleY = (canvasHeight - padding * 2) / imgDisplayHeight;
        scale = Math.min(scaleX, scaleY);
        offsetX = (canvasWidth - imgDisplayWidth * scale) / 2;
        offsetY = (canvasHeight - imgDisplayHeight * scale) / 2;
        updateZoomDisplay();
        render();
    }

    function updateZoomDisplay() {
        const el = document.getElementById('zoom-display');
        if (el) el.textContent = Math.round(scale * 100) + '%';
    }

    // ============================================
    // Navigation
    // ============================================
    function prevImage() {
        if (currentImageIndex > 0) {
            selectImage(currentImageIndex - 1);
        }
    }

    function nextImage() {
        if (currentImageIndex < images.length - 1) {
            selectImage(currentImageIndex + 1);
        }
    }

    // ============================================
    // Labels List
    // ============================================
    function renderLabelsList() {
        const container = document.getElementById('labels-list');
        if (!container) return;

        if (annotations.length === 0) {
            container.innerHTML = `<div style="font-size: 13px; color: var(--text-secondary); padding: 8px 0;" data-i18n="noAnnotations">${t('noAnnotations')}</div>`;
            return;
        }

        const html = annotations.map((ann, idx) => {
            const color = getClassColor(ann.classId);
            const label = classes[ann.classId] || ('class_' + ann.classId);
            const isSelected = idx === selectedBoxIndex;

            return `<div class="label-item ${isSelected ? 'selected' : ''}" onclick="selectAnnotation(${idx})">
                <span class="label-color" style="background: ${color};"></span>
                <span style="flex: 1;">${label}</span>
                <span class="delete-btn" onclick="event.stopPropagation(); deleteAnnotation(${idx})">
                    <i class="fas fa-trash"></i>
                </span>
            </div>`;
        }).join('');

        container.innerHTML = html;
    }

    function selectAnnotation(idx) {
        selectedBoxIndex = idx;
        renderLabelsList();
        render();
    }

    function deleteAnnotation(idx) {
        if (idx >= 0 && idx < annotations.length) {
            annotations.splice(idx, 1);
            if (selectedBoxIndex >= annotations.length) selectedBoxIndex = annotations.length - 1;
            renderLabelsList();
            render();
        }
    }

    // ============================================
    // Class Selector & Dataset Classes
    // ============================================
    function renderClassSelector() {
        const sel = document.getElementById('class-selector');
        if (!sel) return;

        if (classes.length === 0) {
            sel.innerHTML = '<option value="0">class_0</option>';
            return;
        }

        sel.innerHTML = classes.map((cls, idx) =>
            `<option value="${idx}">${cls}</option>`
        ).join('');
    }

    function renderDatasetClasses() {
        const container = document.getElementById('dataset-classes-list');
        if (!container) return;

        if (classes.length === 0) {
            container.innerHTML = `<div style="font-size: 12px; color: var(--text-secondary);" data-i18n="noClasses">${t('noClasses')}</div>`;
            return;
        }

        const html = classes.map((cls, idx) => {
            const color = getClassColor(idx);
            return `<div style="display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px;">
                <span style="width: 12px; height: 12px; border-radius: 3px; background: ${color}; flex-shrink: 0;"></span>
                <span>${cls}</span>
                <span style="color: var(--text-secondary); font-size: 11px; margin-left: auto;">${idx}</span>
            </div>`;
        }).join('');

        container.innerHTML = html;
    }

    // Add a new class from the annotation page and persist to dataset
    async function addClassFromAnnotate() {
        const input = document.getElementById('new-class-input');
        const name = input.value.trim();
        if (!name) return;

        // Check duplicate
        if (classes.includes(name)) {
            showToast(`类别 "${name}" 已存在`, 'warning');
            return;
        }

        const newClasses = [...classes, name];

        try {
            await API.put(`/api/datasets/${datasetId}`, { classes: newClasses });
            classes = newClasses;
            renderClassSelector();
            renderDatasetClasses();
            input.value = '';
            showToast(`已添加类别 "${name}"（ID: ${classes.length - 1}）`, 'success');
        } catch (error) {
            console.error('Failed to add class:', error);
            showToast('添加类别失败: ' + error.message, 'error');
        }
    }

    // ============================================
    // Keyboard Shortcuts
    // ============================================
    function setupKeyboardShortcuts() {
        document.addEventListener('keydown', (e) => {
            // Don't trigger shortcuts when typing in inputs
            const tag = e.target.tagName.toLowerCase();
            if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

            switch (e.key.toLowerCase()) {
                case 'd':
                    if (e.shiftKey) {
                        nextImage();
                    } else {
                        setTool('draw');
                    }
                    e.preventDefault();
                    break;
                case 's':
                    setTool('select');
                    e.preventDefault();
                    break;
                case 'p':
                    setTool('pan');
                    e.preventDefault();
                    break;
                case 'a':
                    prevImage();
                    e.preventDefault();
                    break;
                case 'delete':
                case 'backspace':
                    if (selectedBoxIndex >= 0) {
                        deleteAnnotation(selectedBoxIndex);
                    }
                    e.preventDefault();
                    break;
                case 'escape':
                    selectedBoxIndex = -1;
                    isDrawing = false;
                    drawStart = null;
                    drawCurrent = null;
                    renderLabelsList();
                    render();
                    e.preventDefault();
                    break;
                case 'arrowleft':
                    prevImage();
                    e.preventDefault();
                    break;
                case 'arrowright':
                    nextImage();
                    e.preventDefault();
                    break;
            }
        });
    }

    // ============================================
    // Smart Annotation
    // ============================================
    async function startSmartAnnotation() {
        const epochs = parseInt(document.getElementById('sa-epochs').value) || 50;
        const confidence = parseFloat(document.getElementById('sa-confidence').value) || 0.25;

        const btn = document.getElementById('smart-annotate-btn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>' + t('trainingModel') + '</span>';

        const progressDiv = document.getElementById('smart-progress');
        progressDiv.style.display = 'block';
        document.getElementById('smart-progress-bar').style.width = '0%';
        document.getElementById('smart-status').textContent = t('trainingModel');

        showProgressOverlay(t('smartAnnotateTitle'), t('trainingModel'));

        try {
            const result = await API.post('/api/annotations/' + datasetId + '/smart-annotate', {
                epochs: epochs,
                confidence: confidence
            });

            smartTaskId = result.task_id || result.id;

            // Start polling
            updateProgressOverlay(5, t('trainingModel'));
            smartPollInterval = setInterval(() => pollSmartStatus(), 3000);

        } catch (error) {
            console.error('Smart annotation failed:', error);
            hideProgressOverlay();
            progressDiv.style.display = 'none';
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-magic"></i> <span data-i18n="startSmart">' + t('startSmart') + '</span>';
            showToast(t('smartFailed') + ': ' + error.message, 'error');
        }
    }

    async function pollSmartStatus() {
        if (!smartTaskId) return;

        try {
            const status = await API.get('/api/annotations/' + datasetId + '/smart-annotate/status?task_id=' + smartTaskId);

            const progress = status.progress || 0;
            const phase = status.status || status.phase || '';
            const message = status.message || '';

            updateProgressOverlay(progress, message || phase);

            // Update inline progress too
            document.getElementById('smart-progress-bar').style.width = progress + '%';
            document.getElementById('smart-status').textContent = message || phase;

            if (phase === 'completed' || phase === 'done' || status.completed) {
                clearInterval(smartPollInterval);
                smartPollInterval = null;
                hideProgressOverlay();

                const btn = document.getElementById('smart-annotate-btn');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-magic"></i> <span data-i18n="startSmart">' + t('startSmart') + '</span>';

                // Show detailed result
                const predicted = status.predicted_count || 0;
                const total = status.total_images || 0;
                const errors = status.error_count || 0;
                let toastMsg = `${t('smartCompleted')}: ${predicted}/${total}`;
                if (errors > 0) {
                    toastMsg += ` (${errors} errors)`;
                    showToast(toastMsg, 'warning');
                    // Log detailed errors to console
                    if (status.error_messages && status.error_messages.length > 0) {
                        console.warn('Smart annotation errors:', status.error_messages);
                    }
                } else {
                    showToast(toastMsg, 'success');
                }

                // Reload images and current annotations
                await loadImages();
                if (currentImageIndex >= 0) {
                    const imgData = images[currentImageIndex];
                    await loadAnnotations(imgData.filename || imgData.name);
                    render();
                }
            } else if (phase === 'failed' || phase === 'error') {
                clearInterval(smartPollInterval);
                smartPollInterval = null;
                hideProgressOverlay();

                const btn = document.getElementById('smart-annotate-btn');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-magic"></i> <span data-i18n="startSmart">' + t('startSmart') + '</span>';

                document.getElementById('smart-progress').style.display = 'none';
                showToast(t('smartFailed') + ': ' + (message || 'Unknown error'), 'error');
            } else if (phase === 'predicting') {
                document.getElementById('smart-status').textContent = t('predicting');
            } else if (phase === 'training') {
                document.getElementById('smart-status').textContent = t('trainingModel');
            }

        } catch (error) {
            console.error('Polling error:', error);
            // Don't stop polling on transient errors
        }
    }
    </script>
